# Local development dependencies for jp-stats-elt
#
# Purpose:
#  - Defines dependencies for *local development* (IDE completion, pytest, dbt parse)
#  - Real Airflow / dbt runs happen in the Docker container (see Dockerfile)
#  - Keep the Airflow and Python versions in sync with the Dockerfile so that the
#    container and the host resolve the same packages
#
# Airflow's dependency tree is too large to pin reliably on its own, so it is
# installed against the official constraints file.
#
# For setup steps, see "Local development" in the README.

[project]
name = "jp-stats-elt"
version = "0.1.0"
description = "ELT pipeline for Japanese government statistics (e-Stat) using Airflow + dbt + Postgres"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [
    { name = "Daisuke Kajiya" },
]

# Runtime dependencies (kept in line with the container)
dependencies = [
    "apache-airflow==2.9.3",
    "apache-airflow-providers-postgres",
    "dbt-core>=1.8,<1.9",
    "dbt-postgres>=1.8,<1.9",
    "great-expectations>=0.18,<0.19",
    "requests",
    "pandas",
    "psycopg2-binary",
]

[project.optional-dependencies]
# Note: Airflow 2.9.3's constraints pin pytest, mypy and others, so keep lower bounds
# on dev dependencies loose and let the constraints decide.
dev = [
    "pytest",
    "pytest-cov",
    "ruff==0.16.4",
    "mypy",
    "types-requests",
    "responses"
]

# This project is an application (DAGs + dbt + Docker), not a distributable Python
# package. Disable setuptools' automatic package discovery so that pyproject.toml
# serves only as a dependency manifest.
[tool.setuptools]
packages = []

# ===== uv =====
# Airflow's large dependency tree is resolved against the official constraints
# for Python 3.11 / Airflow 2.9.3 (matching the Dockerfile).
[tool.uv]
constraint-dependencies = []
override-dependencies = []

# The constraints file is not declared here. Instead, `make lock` and `make setup`
# pass it to `uv pip compile` via `--constraint "$(CONSTRAINT_URL)"`.

# ===== ruff =====
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by ruff format)
]

[tool.ruff.lint.per-file-ignores]
# By Airflow convention, DAG files start with `from __future__ import annotations`
"airflow/dags/*.py" = ["E402"]

# ===== pytest =====
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["airflow", "scripts"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]

# ===== mypy =====
[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
