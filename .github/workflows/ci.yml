name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Install ruff alone. Linting needs neither Airflow nor pandas, and the full
      # dependency set would add minutes to the job.
      # Keep the version in sync with the pin in pyproject.toml.
      - name: Install ruff
        run: pip install "ruff==0.16.4"

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Runtime dependencies come from requirements.lock (resolved against Airflow's
      # constraints); test-only dependencies come from the dev extras in pyproject.toml.
      # The lock is installed first, so unpinned packages in the dev extras are already
      # satisfied by the installed versions and are not overwritten.
      - name: Install dependencies
        run: |
          pip install -r requirements.lock
          pip install ".[dev]"
          pip list | grep -Ei 'ruff|pytest|responses|apache-airflow |pandas'

      # No database is provided here, so test_upsert_is_idempotent is expected to skip.
      # -rs prints the skip reason so each run shows the skip is the intended one.
      - name: Run pytest
        run: pytest -rs

  dbt:
    name: dbt (build)
    runs-on: ubuntu-latest

    # dbt cannot verify anything without a database, so the job gets its own postgres.
    # GitHub Actions waits for health-cmd to pass before starting the steps.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: airflow
          POSTGRES_PASSWORD: airflow
          # init-warehouse.sql creates the warehouse database itself. Creating it here
          # would stop CI from running the same SQL as the Docker stack.
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Every field in profiles.yml reads from env_var, so exporting these variables points
    # the existing dev target at this postgres; no CI-specific target is needed.
    env:
      WAREHOUSE_HOST: localhost
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_USER: airflow
      WAREHOUSE_PASSWORD: airflow
      WAREHOUSE_DB: warehouse

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install -r requirements.lock

      # Run the same DDL as the Docker stack. A CI-only schema would drift from it.
      - name: Create warehouse schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/init-warehouse.sql
        env:
          DATABASE_URL: postgresql://airflow:airflow@localhost:5432/postgres

      # Load the committed fixture in place of a live extraction.
      - name: Load raw.cpi fixture
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "\copy raw.cpi (tab_code, area_code, category_code, time_code, value, value_raw, unit) FROM 'tests/fixtures/raw_cpi_sample.csv' WITH CSV HEADER"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "SELECT COUNT(*) AS raw_cpi_rows FROM raw.cpi;"
        env:
          DATABASE_URL: postgresql://airflow:airflow@localhost:5432/warehouse

      - name: Install dbt packages
        run: dbt deps --project-dir dbt --profiles-dir dbt

      - name: Run dbt build
        run: dbt build --project-dir dbt --profiles-dir dbt