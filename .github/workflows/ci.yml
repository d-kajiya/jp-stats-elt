name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ruff のみをインストールする。lint に Airflow や pandas は不要で、
      # 依存を丸ごと入れるとジョブが数分伸びる。
      # バージョンは pyproject.toml のピンと一致させること。
      - name: Install ruff
        run: pip install "ruff==0.16.4"

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ランタイム依存は requirements.lock（Airflow constraints 準拠）から。
      # テスト専用依存は pyproject.toml の dev extras から入れる。
      # lock を先に入れているので、dev extras 側の無指定パッケージは
      # 既存のインストール済みバージョンで要求が満たされ、上書きされない。
      - name: Install dependencies
        run: |
          pip install -r requirements.lock
          pip install ".[dev]"
          pip list | grep -Ei 'ruff|pytest|responses|apache-airflow |pandas'

      # DB を用意しないため test_upsert_is_idempotent は skip される想定。
      # -rs で skip の理由をログに出し、意図した skip か毎回確認できるようにする。
      - name: Run pytest
        run: pytest -rs

  dbt:
    name: dbt (build)
    runs-on: ubuntu-latest

    # dbt は DB が無いと何も検証できないので、ジョブ専用の postgres を立てる。
    # health-cmd が通るまで GitHub Actions がステップ開始を待ってくれる。
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: airflow
          POSTGRES_PASSWORD: airflow
          # warehouse は init-warehouse.sql が CREATE DATABASE する。
          # ここで作ってしまうと本番と同じ SQL が流せなくなる。
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # profiles.yml は全項目が env_var 経由なので、CI 用の target を足さずに
    # 環境変数を渡すだけで dev target がこの postgres を指す。
    env:
      WAREHOUSE_HOST: localhost
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_USER: airflow
      WAREHOUSE_PASSWORD: airflow
      WAREHOUSE_DB: warehouse

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install -r requirements.lock

      # 本番と同じ DDL を流す。CI 専用のスキーマ定義を書くと本番と乖離する。
      - name: Create warehouse schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/init-warehouse.sql
        env:
          DATABASE_URL: postgresql://airflow:airflow@localhost:5432/postgres

      # extract の代わりに固定フィクスチャを流し込む。
      - name: Load raw.cpi fixture
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "\copy raw.cpi (tab_code, area_code, category_code, time_code, value, value_raw, unit) FROM 'tests/fixtures/raw_cpi_sample.csv' WITH CSV HEADER"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "SELECT COUNT(*) AS raw_cpi_rows FROM raw.cpi;"
        env:
          DATABASE_URL: postgresql://airflow:airflow@localhost:5432/warehouse

      - name: Install dbt packages
        run: dbt deps --project-dir dbt --profiles-dir dbt

      - name: Run dbt build
        run: dbt build --project-dir dbt --profiles-dir dbt