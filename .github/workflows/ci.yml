name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ruff のみをインストールする。lint に Airflow や pandas は不要で、
      # 依存を丸ごと入れるとジョブが数分伸びる。
      # バージョンは pyproject.toml のピンと一致させること。
      - name: Install ruff
        run: pip install "ruff==0.16.4"

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ランタイム依存は requirements.lock（Airflow constraints 準拠）から。
      # テスト専用依存は pyproject.toml の dev extras から入れる。
      # lock を先に入れているので、dev extras 側の無指定パッケージは
      # 既存のインストール済みバージョンで要求が満たされ、上書きされない。
      - name: Install dependencies
        run: |
          pip install -r requirements.lock
          pip install ".[dev]"
          pip list | grep -Ei 'ruff|pytest|responses|apache-airflow |pandas'

      # DB を用意しないため test_upsert_is_idempotent は skip される想定。
      # -rs で skip の理由をログに出し、意図した skip か毎回確認できるようにする。
      - name: Run pytest
        run: pytest -rs