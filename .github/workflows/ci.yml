name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ruff のみをインストールする。lint に Airflow や pandas は不要で、
      # 依存を丸ごと入れるとジョブが数分伸びる。
      # バージョンは pyproject.toml のピンと一致させること。
      - name: Install ruff
        run: pip install "ruff==0.16.4"

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .