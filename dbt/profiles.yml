# dbt connection profile
#
# All credentials are injected through environment variables, so no secrets live in
# the repository. docker-compose.yml passes WAREHOUSE_* into the Airflow container, so
# they resolve automatically when the BashOperator runs `dbt run`. CI exports the same
# variables to point this target at its postgres service.
#
# To run dbt directly from the host, source `.env` first.

jp_stats_elt:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('WAREHOUSE_HOST') }}"
      port: "{{ env_var('WAREHOUSE_PORT') | int }}"
      user: "{{ env_var('WAREHOUSE_USER') }}"
      password: "{{ env_var('WAREHOUSE_PASSWORD') }}"
      dbname: "{{ env_var('WAREHOUSE_DB') }}"
      schema: staging
      threads: 4
      keepalives_idle: 0
      sslmode: disable
