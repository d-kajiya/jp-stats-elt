# dbt project configuration
#
# Layers:
#  staging      → 1:1 cleanup of raw (types, column names and NULL handling only)
#  intermediate → join staging models and select analysable periods (complete-month filter)
#  marts        → analysis-ready facts and aggregates

name: 'jp_stats_elt'
version: '1.0.0'
config-version: 2

profile: 'jp_stats_elt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  jp_stats_elt:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
